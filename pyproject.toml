[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "where-my-money"
version = "0.1.0"
description = "Personal spending tracker package template"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "leeh8911" }
]
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
